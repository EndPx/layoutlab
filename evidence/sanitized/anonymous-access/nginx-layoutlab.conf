server {
    listen 80;
    listen [::]:80;
    server_name layoutlab.endpx.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/layoutlab/acme; }
    location / { return 301 https://layoutlab.endpx.cloud$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name layoutlab.endpx.cloud;
    ssl_certificate /etc/letsencrypt/live/layoutlab.endpx.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layoutlab.endpx.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/operations/investigations/verify {
        proxy_pass http://127.0.0.1:4301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 150s;
    }
    location = /api/operations/layout-investigations/verify {
        proxy_pass http://127.0.0.1:4301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 150s;
    }
    location ~ ^/api/(runs(?:/|$)|operations/(proposals(?:/|$)|investigations(?:/|$)|layout-investigations(?:/|$))) {
        auth_basic off;
        proxy_pass http://127.0.0.1:4301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 150s;
    }
    location = /live-access { return 302 /; }
    location = / {
        if ($args = "") { return 302 /?mode=operations; }
        proxy_pass http://127.0.0.1:4301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 150s;
    }
    location / {
        proxy_pass http://127.0.0.1:4301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 150s;
    }
}
